version: v0.12
superbench:
  enable: [deepseek-v2-lite-inference]
  monitor:
    enable: true
    sample_duration: 1
    sample_interval: 1
  benchmarks:
    deepseek-v2-lite-inference:
      enable: true
      modes:
        - name: local
          proc_num: 1
          parallel: false
          prefix: CUDA_VISIBLE_DEVICES=0
      timeout: 3600
      parameters:
        runtime_python: /opt/vllm/bin/python
        reference_python: /opt/deepseek-reference/bin/python
        cache_root: /data/deepseek-v2-lite
        batch_size: 8
        seq_len: 512
        max_new_tokens: 64
        num_warmup: 2
        num_steps: 8
        duration: 3300
