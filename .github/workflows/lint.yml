name: Lint

on:
  pull_request:
    branches:
    - main
    - release/*
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spelling:
    if: ${{ !github.event.pull_request.draft }}
    name: Spelling check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Install misspell
      run: |
        go install github.com/client9/misspell/cmd/misspell@v0.3.4
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
    - name: Check spelling
      run: misspell -error .
  cpp:
    if: ${{ !github.event.pull_request.draft }}
    name: CPP code lint
    runs-on: ubuntu-24.04
    steps:
    - name: Install clang-format-14
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-14
        sudo ln -sf /usr/bin/clang-format-14 /usr/bin/clang-format
    - name: Checkout
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Echo clang-format version
      run: |
        clang-format --version
    - name: Lint
      run: |
        make cpplint
