---
- name: Exercise the collection operations used by SuperBench
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate the deployment key
      community.crypto.openssh_keypair:
        path: '{{ test_root }}/id_ed25519'
        type: ed25519
        comment: superbench
        force: false
      register: first_key
      no_log: true
    - name: Preserve the deployment key on a repeated run
      community.crypto.openssh_keypair:
        path: '{{ test_root }}/id_ed25519'
        type: ed25519
        comment: superbench
        force: false
      register: second_key
      no_log: true
    - name: Check idempotency without inspecting the private key
      assert:
        that:
          - first_key is changed
          - second_key is not changed
          - first_key.public_key == second_key.public_key
    - name: Check ranks against sorted hostfile entries
      vars:
        nodes: "{{ ['node2', 'node0', 'node1'] | sort }}"
      assert:
        that:
          - lookup('ansible.utils.index_of', nodes, 'eq', 'node0') | int == 0
          - lookup('ansible.utils.index_of', nodes, 'eq', 'node1') | int == 1
          - lookup('ansible.utils.index_of', nodes, 'eq', 'node2') | int == 2
          - nodes | join('\n') == 'node0\nnode1\nnode2'
    - name: Prepare disposable result directories
      file:
        path: '{{ test_root }}/{{ item }}'
        state: directory
        mode: '0700'
      loop:
        - source/nodes
        - received/nodes
    - name: Create a benchmark result
      copy:
        content: '{"result": 42}'
        dest: '{{ test_root }}/source/results.json'
        mode: '0600'
    - name: Create a result that must not be recursively collected
      copy:
        content: excluded
        dest: '{{ test_root }}/source/nodes/excluded'
        mode: '0600'

- name: Exercise the production result-fetch playbook
  import_playbook: ../../superbench/runner/playbooks/fetch_results.yaml
  vars:
    sb_output_dir: '{{ test_root }}/source'
    absolute_output_dir: '{{ test_root }}/received'

- name: Verify the fetched result layout
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the disposable benchmark result
      slurp:
        src: '{{ test_root }}/received/nodes/{{ ansible_hostname }}/results.json'
      register: result
    - name: Check the excluded directory
      stat:
        path: '{{ test_root }}/received/nodes/{{ ansible_hostname }}/nodes'
      register: excluded
    - name: Check result content and recursion exclusion
      assert:
        that:
          - "result.content | b64decode | from_json == {'result': 42}"
          - not excluded.stat.exists
